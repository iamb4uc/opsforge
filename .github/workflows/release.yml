name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-checks:
    name: linux checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: openssh for audit regression
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: full linux validation
        shell: bash
        run: ./bin/test all

  windows-checks:
    name: windows checks
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: full validation in Windows PowerShell
        shell: powershell
        run: .\bin\test.ps1 all

      - name: full validation in PowerShell
        shell: pwsh
        run: .\bin\test.ps1 all

      - name: pester
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          $result = Invoke-Pester -Path .\tests\pester -PassThru
          if ($result.FailedCount -ne 0) { throw "Pester failures: $($result.FailedCount)" }

  release:
    name: create release
    runs-on: ubuntu-latest
    needs:
      - linux-checks
      - windows-checks
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          notes_file="release-notes.md"

          awk -v tag="$tag" '
            BEGIN { found = 0 }
            $0 ~ "^## " tag "([[:space:]-]|$)" {
              found = 1
              next
            }
            found && $0 ~ "^## " {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            {
              printf '%s\n\n' "$tag"
              printf '%s\n' "See CHANGELOG.md for the closest notes."
            } > "$notes_file"
          fi

      - name: create github release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag"
            exit 0
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md
