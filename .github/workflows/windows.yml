name: windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  investigator:
    name: windows investigator build and saved-case tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
      - name: Rust checks
        shell: pwsh
        run: |
          cargo +1.93.0 fmt --manifest-path investigate/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.0 clippy --locked --manifest-path investigate/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.0 test --locked --manifest-path investigate/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.0 build --locked --manifest-path investigate/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\investigate\target\debug\opsforge-investigate.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: private-directory helper parser
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path investigate/src/private-directory.ps1), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

  powershell:
    name: powershell validation
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: behavioral validation in Windows PowerShell
        shell: powershell
        run: .\bin\test.ps1 all

      - name: behavioral validation in PowerShell
        shell: pwsh
        run: .\bin\test.ps1 all

      - name: command availability
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $commands = @(
            'Get-CimInstance',
            'Get-LocalUser',
            'Get-LocalGroupMember',
            'Get-Process',
            'Get-Service',
            'Get-ScheduledTask',
            'Get-ScheduledTaskInfo',
            'Get-NetTCPConnection',
            'Get-NetFirewallProfile',
            'Get-NetFirewallRule',
            'Get-NetFirewallPortFilter',
            'Get-NetFirewallAddressFilter',
            'Get-NetAdapter',
            'Get-NetRoute',
            'Get-DnsClientCache',
            'Get-WinEvent',
            'Get-EventLog',
            'Get-HotFix',
            'Get-AuthenticodeSignature',
            'Get-MpComputerStatus',
            'Get-MpPreference'
          )
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "missing expected Windows command: $command"
            }
          }

      - name: pester
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          $result = Invoke-Pester -Path .\tests\pester -PassThru
          if ($result.FailedCount -ne 0) { throw "Pester failures: $($result.FailedCount)" }

      - name: doctor
        shell: powershell
        run: .\bin\opsforge.ps1 doctor

      - name: windows all
        shell: powershell
        run: .\bin\opsforge.ps1 windows all -OutputPath .\output -Json -Markdown

      - name: upload windows artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-artifacts
          path: .ci-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true

      - name: upload runtime output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-windows-runtime-output
          path: output/
          if-no-files-found: error
